
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Zikr & Namaaz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-grad: linear-gradient(rgba(10, 5, 25, 0.92), rgba(5, 2, 15, 0.96));
            --primary: #ff007f;
            --primary-hover: #e60073;
            --box-bg: rgba(18, 10, 35, 0.92);
            --shadow: rgba(255, 0, 127, 0.45);
        }
        body {
            background: var(--bg-grad), 
                        linear-gradient(90deg, rgba(0, 200, 255, 0.15) 0%, rgba(255, 0, 0, 0.15) 100%),
                        url('https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #ffffff;
        }
        .theme-title { color: var(--primary); text-shadow: 0 0 15px var(--shadow); }
        .theme-box { background: var(--box-bg); border: 1.5px solid var(--primary); box-shadow: 0 0 25px var(--shadow); backdrop-filter: blur(8px); }
        .theme-btn { background: var(--primary); color: #fff; font-weight: bold; box-shadow: 0 0 20px var(--shadow); transition: 0.3s; }
        .theme-btn:hover { background: var(--primary-hover); box-shadow: 0 0 30px var(--shadow); }
    </style>
</head>
<body class="min-h-screen font-sans p-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="theme-box p-4 rounded-xl flex justify-between items-center flex-wrap gap-4 relative">
            <h1 class="text-xl font-bold theme-title">📿 Zikr & Namaaz Portal</h1>
            <div class="flex items-center gap-2 flex-wrap">
                <!-- Theme Picker Button -->
                <button onclick="toggleThemeModal()" id="themeBtn" class="bg-slate-900 border text-xs rounded px-3 py-2 text-white outline-none flex items-center gap-2 border-[var(--primary)] shadow font-semibold">
                    🎨 <span id="currentThemeName">Select Theme (25)</span> ▼
                </button>

                <button onclick="switchTab('tracker')" id="btn-tracker" class="px-3 py-2 rounded font-medium theme-btn text-xs">Daily Zikr</button>
                <button onclick="switchTab('extrasawaab')" id="btn-extrasawaab" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">Extra Sawaab</button>
                <button onclick="switchTab('namaaz')" id="btn-namaaz" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">Daily Namaaz</button>
                <button onclick="switchTab('analytics')" id="btn-analytics" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">Analytics</button>
            </div>
        </header>

        <!-- THEME SELECTION MODAL POPUP (25 Themes Scrollable List) -->
        <div id="themeModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="theme-box p-6 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                    <h2 class="text-lg font-bold theme-title">Select from 25 Luxury Themes</h2>
                    <button onclick="toggleThemeModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                </div>
                <div id="themeListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2 overflow-y-auto pr-2 max-h-[60vh]">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>

        <!-- TAB 1: DAILY ZIKR -->
        <section id="tab-tracker" class="theme-box p-6 rounded-xl space-y-4">
            <h2 class="text-lg font-semibold theme-title">Mark Daily Zikr</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelect" class="bg-slate-900 border rounded p-2 text-white text-sm"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelect" class="bg-slate-900 border rounded p-2 text-white text-sm">
            </div>
            <div id="zikrList" class="space-y-3"></div>
            <button onclick="saveZikr()" class="w-full theme-btn py-2.5 rounded text-sm">Save Zikr Progress</button>
        </section>

        <!-- TAB 2: EXTRA SAWAAB -->
        <section id="tab-extrasawaab" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <h2 class="text-lg font-semibold theme-title">Mark Extra Sawaab</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelectExtra" class="bg-slate-900 border rounded p-2 text-white text-sm"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelectExtra" class="bg-slate-900 border rounded p-2 text-white text-sm">
            </div>
            <div id="extraList" class="space-y-2"></div>
            <button onclick="save('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra')" class="w-full theme-btn py-2.5 rounded text-sm">Save Extra Sawaab</button>
        </section>

        <!-- TAB 3: DAILY NAMAAZ -->
        <section id="tab-namaaz" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <h2 class="text-lg font-semibold theme-title">Mark Daily Namaaz</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelectNamaaz" class="bg-slate-900 border rounded p-2 text-white text-sm"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelectNamaaz" class="bg-slate-900 border rounded p-2 text-white text-sm">
            </div>
            <div id="namaazList" class="space-y-2"></div>
            <button onclick="save('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz')" class="w-full theme-btn py-2.5 rounded text-sm">Save Namaaz Progress</button>
        </section>

        <!-- TAB 4: ANALYTICS -->
        <section id="tab-analytics" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h2 class="text-lg font-semibold theme-title">Analytics & Reports</h2>
                <div class="flex gap-2">
                    <select id="catSelect" onchange="drawChart()" class="bg-slate-900 border rounded p-1.5 text-white text-xs">
                        <option value="zikr">Daily Zikr</option>
                        <option value="extra">Extra Sawaab</option>
                        <option value="namaaz">Daily Namaaz</option>
                    </select>
                    <select id="timeSelect" onchange="drawChart()" class="bg-slate-900 border rounded p-1.5 text-white text-xs">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="cards"></div>
            <div class="relative h-72"><canvas id="myChart"></canvas></div>
        </section>
    </div>

    <script>
        const themes = {
            cyberpunkneon: { name: "⚡ 1. Cyberpunk Neon Glow", primary: "#ff007f", hover: "#e60073", box: "rgba(18, 10, 35, 0.92)", shadow: "rgba(255, 0, 127, 0.45)", bg: "linear-gradient(rgba(10, 5, 25, 0.92), rgba(5, 2, 15, 0.96))" },
            emerald: { name: "💎 2. Emerald Cyan", primary: "#00ffcc", hover: "#00cca3", box: "rgba(13, 20, 38, 0.9)", shadow: "rgba(0, 255, 204, 0.2)", bg: "linear-gradient(rgba(5, 10, 25, 0.90), rgba(5, 10, 25, 0.94))" },
            gold: { name: "👑 3. Royal Gold", primary: "#d4af37", hover: "#b3922f", box: "rgba(30, 25, 15, 0.9)", shadow: "rgba(212, 175, 55, 0.25)", bg: "linear-gradient(rgba(15, 15, 15, 0.92), rgba(25, 20, 10, 0.95))" },
            sapphire: { name: "🔷 4. Sapphire Blue", primary: "#3b82f6", hover: "#2563eb", box: "rgba(15, 23, 42, 0.9)", shadow: "rgba(59, 130, 246, 0.3)", bg: "linear-gradient(rgba(10, 15, 35, 0.90), rgba(5, 10, 25, 0.94))" },
            ruby: { name: "❤️ 5. Ruby Crimson", primary: "#ef4444", hover: "#dc2626", box: "rgba(35, 15, 15, 0.9)", shadow: "rgba(239, 68, 68, 0.3)", bg: "linear-gradient(rgba(30, 10, 10, 0.90), rgba(15, 5, 5, 0.94))" },
            amethyst: { name: "🔮 6. Royal Amethyst", primary: "#a855f7", hover: "#9333ea", box: "rgba(25, 15, 35, 0.9)", shadow: "rgba(168, 85, 247, 0.3)", bg: "linear-gradient(rgba(20, 10, 30, 0.90), rgba(10, 5, 20, 0.94))" },
            rosegold: { name: "✨ 7. Rose Gold", primary: "#fb7185", hover: "#f43f5e", box: "rgba(35, 18, 24, 0.9)", shadow: "rgba(251, 113, 133, 0.3)", bg: "linear-gradient(rgba(30, 15, 20, 0.90), rgba(15, 8, 10, 0.94))" },
            platinum: { name: "🪙 8. Platinum Silver", primary: "#e2e8f0", hover: "#cbd5e1", box: "rgba(30, 41, 59, 0.9)", shadow: "rgba(226, 232, 240, 0.2)", bg: "linear-gradient(rgba(15, 23, 42, 0.90), rgba(15, 23, 42, 0.94))" },
            emeraldgreen: { name: "🌿 9. Imperial Emerald", primary: "#10b981", hover: "#059669", box: "rgba(10, 30, 20, 0.9)", shadow: "rgba(16, 185, 129, 0.3)", bg: "linear-gradient(rgba(5, 25, 15, 0.90), rgba(2, 15, 8, 0.94))" },
            sunset: { name: "🌅 10. Sunset Copper", primary: "#f97316", hover: "#ea580c", box: "rgba(35, 18, 10, 0.9)", shadow: "rgba(249, 115, 22, 0.3)", bg: "linear-gradient(rgba(30, 15, 5, 0.90), rgba(15, 8, 2, 0.94))" },
            cyber: { name: "⚡ 11. Cyber Neon Luxe", primary: "#f43f5e", hover: "#e11d48", box: "rgba(20, 10, 40, 0.9)", shadow: "rgba(244, 63, 94, 0.4)", bg: "linear-gradient(rgba(10, 5, 30, 0.90), rgba(5, 2, 15, 0.94))" },
            neonblue: { name: "🔹 12. Electric Neon Blue", primary: "#00d2ff", hover: "#0099cc", box: "rgba(5, 20, 35, 0.92)", shadow: "rgba(0, 210, 255, 0.4)", bg: "linear-gradient(rgba(2, 10, 25, 0.92), rgba(1, 5, 15, 0.96))" },
            neongreen: { name: "🟢 13. Toxic Neon Green", primary: "#00ff66", hover: "#00cc52", box: "rgba(5, 30, 15, 0.92)", shadow: "rgba(0, 255, 102, 0.4)", bg: "linear-gradient(rgba(2, 15, 8, 0.92), rgba(1, 8, 3, 0.96))" },
            neonyellow: { name: "🟡 14. Laser Neon Yellow", primary: "#ccff00", hover: "#a3cc00", box: "rgba(25, 30, 5, 0.92)", shadow: "rgba(204, 255, 0, 0.4)", bg: "linear-gradient(rgba(12, 15, 2, 0.92), rgba(6, 8, 1, 0.96))" },
            neonpurple: { name: "🟣 15. Ultraviolet Neon", primary: "#9d00ff", hover: "#7e00cc", box: "rgba(20, 5, 35, 0.92)", shadow: "rgba(157, 0, 255, 0.4)", bg: "linear-gradient(rgba(10, 2, 18, 0.92), rgba(5, 1, 9, 0.96))" },
            neonorange: { name: "🟠 16. Blazing Neon Orange", primary: "#ff5500", hover: "#cc4400", box: "rgba(35, 15, 5, 0.92)", shadow: "rgba(255, 85, 0, 0.4)", bg: "linear-gradient(rgba(18, 7, 2, 0.92), rgba(9, 3, 1, 0.96))" },
            midnight: { name: "🌙 17. Midnight Dark", primary: "#64748b", hover: "#475569", box: "rgba(15, 23, 42, 0.92)", shadow: "rgba(100, 116, 139, 0.3)", bg: "linear-gradient(rgba(2, 6, 23, 0.92), rgba(1, 3, 12, 0.96))" },
            galaxy: { name: "🌌 18. Deep Galaxy Purple", primary: "#c084fc", hover: "#a855f7", box: "rgba(24, 10, 45, 0.92)", shadow: "rgba(192, 132, 252, 0.4)", bg: "linear-gradient(rgba(12, 5, 25, 0.92), rgba(6, 2, 12, 0.96))" },
            crimson: { name: "🩸 19. Dark Crimson Night", primary: "#991b1b", hover: "#7f1d1d", box: "rgba(40, 10, 10, 0.92)", shadow: "rgba(153, 27, 27, 0.4)", bg: "linear-gradient(rgba(20, 5, 5, 0.92), rgba(10, 2, 2, 0.96))" },
            ocean: { name: "🌊 20. Deep Ocean Teal", primary: "#0d9488", hover: "#0f766e", box: "rgba(10, 30, 30, 0.92)", shadow: "rgba(13, 148, 136, 0.4)", bg: "linear-gradient(rgba(5, 15, 15, 0.92), rgba(2, 8, 8, 0.96))" },
            forest: { name: "🌲 21. Dark Forest Pine", primary: "#15803d", hover: "#166534", box: "rgba(10, 35, 20, 0.92)", shadow: "rgba(21, 128, 61, 0.4)", bg: "linear-gradient(rgba(5, 18, 10, 0.92), rgba(2, 9, 5, 0.96))" },
            coffee: { name: "☕ 22. Espresso Coffee", primary: "#b45309", hover: "#92400e", box: "rgba(35, 20, 10, 0.92)", shadow: "rgba(180, 83, 9, 0.4)", bg: "linear-gradient(rgba(18, 10, 5, 0.92), rgba(9, 5, 2, 0.96))" },
            lavender: { name: "🪻 23. Soft Lavender Dark", primary: "#d8b4fe", hover: "#c084fc", box: "rgba(30, 20, 40, 0.92)", shadow: "rgba(216, 180, 254, 0.3)", bg: "linear-gradient(rgba(15, 10, 20, 0.92), rgba(8, 5, 10, 0.96))" },
            peach: { name: "🍑 24. Sunset Peach", primary: "#ffedd5", hover: "#fed7aa", box: "rgba(40, 25, 20, 0.92)", shadow: "rgba(255, 237, 213, 0.3)", bg: "linear-gradient(rgba(20, 12, 10, 0.92), rgba(10, 6, 5, 0.96))" },
            monochrome: { name: "♟️ 25. Sleek Monochrome", primary: "#ffffff", hover: "#cbd5e1", box: "rgba(24, 24, 27, 0.92)", shadow: "rgba(255, 255, 255, 0.25)", bg: "linear-gradient(rgba(9, 9, 11, 0.92), rgba(3, 3, 4, 0.96))" }
        };

        function initThemeModal() {
            const container = document.getElementById('themeListContainer');
            container.innerHTML = '';
            Object.keys(themes).forEach(key => {
                const t = themes[key];
                container.innerHTML += `<div onclick="changeTheme('${key}')" class="p-2.5 text-xs rounded-lg cursor-pointer hover:bg-slate-800 transition text-white font-medium border border-slate-700/60 flex items-center justify-between"><span>${t.name}</span><span class="w-3 h-3 rounded-full" style="background:${t.primary}"></span></div>`;
            });
        }

        function toggleThemeModal() {
            const modal = document.getElementById('themeModal');
            modal.classList.toggle('hidden');
        }

        function changeTheme(name) {
            const t = themes[name] || themes.cyberpunkneon;
            const r = document.documentElement;
            r.style.setProperty('--primary', t.primary);
            r.style.setProperty('--primary-hover', t.hover);
            r.style.setProperty('--box-bg', t.box);
            r.style.setProperty('--shadow', t.shadow);
            r.style.setProperty('--bg-grad', t.bg);
            document.getElementById('currentThemeName').innerText = t.name;
            document.getElementById('themeModal').classList.add('hidden');
            localStorage.setItem('selectedTheme', name);
        }

        const savedTheme = localStorage.getItem('selectedTheme') || 'cyberpunkneon';
        initThemeModal();
        changeTheme(savedTheme);

        const persons = ["Imran", "Saima", "Huzaifa", "Ali"];
        const zikrs = ["1. 1st Kalma", "2. 4th Kalma", "3. Tasbee", "4. Subhanallahi wa bihamdihi, subhanallahil azeem", "5. Aytal Qursi", "6. Last 2 Aayat", "7. Astagfirullah (100x)"];
        const extras = ["1. Quran Reading", "2. Tahajjud namaaz", "3. Witr namaaz", "4. Nafil namaaz", "5. Sunnat namaaz"];
        const namaazs = ["1. Fajr", "2. Asar", "3. Zohar", "4. Maghrib", "5. Isha"];

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateSelect').value = today;
        document.getElementById('dateSelectExtra').value = today;
        document.getElementById('dateSelectNamaaz').value = today;

        function renderZikr() {
            const el = document.getElementById('zikrList');
            el.innerHTML = '';
            zikrs.forEach((item, i) => {
                if(i === 3) {
                    el.innerHTML += `
                        <div class="p-2.5 bg-slate-900/80 border border-slate-700 rounded space-y-2">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="checkbox" id="zikr-${i}" class="w-4 h-4 accent-[var(--primary)]">
                                <span class="text-sm font-medium">${item}</span>
                            </label>
                            <div class="flex items-center justify-between pl-7">
                                <span class="text-xs text-slate-400">Kitni baar padha (Count):</span>
                                <input type="number" id="zikr-count-${i}" min="0" placeholder="e.g. 100" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white w-24 text-center outline-none focus:border-[var(--primary)]">
                            </div>
                        </div>`;
                } else {
                    el.innerHTML += `<label class="flex items-center gap-3 p-2.5 bg-slate-900/80 border border-slate-700 rounded cursor-pointer"><input type="checkbox" id="zikr-${i}" class="w-4 h-4 accent-[var(--primary)]"><span class="text-sm">${item}</span></label>`;
                }
            });
        }

        function render(list, id, prefix) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            list.forEach((item, i) => {
                el.innerHTML += `<label class="flex items-center gap-3 p-2.5 bg-slate-900/80 border border-slate-700 rounded cursor-pointer"><input type="checkbox" id="${prefix}-${i}" class="w-4 h-4 accent-[var(--primary)]"><span class="text-sm">${item}</span></label>`;
            });
        }
        renderZikr();
        render(extras, 'extraList', 'extra');
        render(namaazs, 'namaazList', 'namaaz');

        function switchTab(tab) {
            ['tracker', 'extrasawaab', 'namaaz', 'analytics'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`btn-${t}`).className = `px-3 py-2 rounded font-medium text-xs ${t === tab ? 'theme-btn' : 'bg-slate-800 text-slate-300'}`;
            });
            if(tab === 'analytics') drawChart();
        }

        function getData(key) { return JSON.parse(localStorage.getItem(key) || '{}'); }

        function saveZikr() {
            const p = document.getElementById('personSelect').value;
            const d = document.getElementById('dateSelect').value;
            const data = getData('zikrData');
            if(!data[p]) data[p] = {};
            
            const checks = zikrs.map((_, i) => document.getElementById(`zikr-${i}`).checked);
            const countVal = document.getElementById('zikr-count-3').value || '0';
            
            data[p][d] = { checks: checks, subhanallahCount: countVal };
            localStorage.setItem('zikrData', JSON.stringify(data));
            alert('Zikr progress & count saved successfully!');
        }

        function save(key, list, prefix, pId, dId) {
            const p = document.getElementById(pId).value;
            const d = document.getElementById(dId).value;
            const data = getData(key);
            if(!data[p]) data[p] = {};
            data[p][d] = list.map((_, i) => document.getElementById(`${prefix}-${i}`).checked);
            localStorage.setItem(key, JSON.stringify(data));
            alert('Saved successfully!');
        }

        function loadState() {
            const p = document.getElementById('personSelect').value;
            const d = document.getElementById('dateSelect').value;
            const saved = getData('zikrData')[p]?.[d];
            
            const checks = saved?.checks || new Array(zikrs.length).fill(false);
            zikrs.forEach((_, i) => document.getElementById(`zikr-${i}`).checked = checks[i]);
            document.getElementById('zikr-count-3').value = saved?.subhanallahCount || '';
        }

        function loadStateGeneric(key, list, prefix, pId, dId) {
            const p = document.getElementById(pId).value;
            const d = document.getElementById(dId).value;
            const checks = getData(key)[p]?.[d] || new Array(list.length).fill(false);
            list.forEach((_, i) => document.getElementById(`${prefix}-${i}`).checked = checks[i]);
        }

        document.getElementById('personSelect').onchange = loadState;
        document.getElementById('dateSelect').onchange = loadState;
        document.getElementById('personSelectExtra').onchange = () => loadStateGeneric('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');
        document.getElementById('dateSelectExtra').onchange = () => loadStateGeneric('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');
        document.getElementById('personSelectNamaaz').onchange = () => loadStateGeneric('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz');
        document.getElementById('dateSelectNamaaz').onchange = () => loadStateGeneric('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz');

        loadState();
        loadStateGeneric('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');
        loadStateGeneric('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz');

        let chart = null;
        function drawChart() {
            const cat = document.getElementById('catSelect').value;
            const tf = document.getElementById('timeSelect').value;
            const cards = document.getElementById('cards');
            cards.innerHTML = '';

            if(cat === 'zikr') {
                const data = getData('zikrData');
                const pcts = persons.map(p => {
                    const pData = data[p] || {};
                    let comp = 0, poss = 0, now = new Date();
                    Object.keys(pData).forEach(dStr => {
                        const d = new Date(dStr);
                        let inc = false;
                        if (tf === 'daily' && dStr === today) inc = true;
                        else if (tf === 'weekly' && Math.abs(now - d) / 86400000 <= 7) inc = true;
                        else if (tf === 'monthly' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) inc = true;
                        else if (tf === 'yearly' && d.getFullYear() === now.getFullYear()) inc = true;
                        if (inc && pData[dStr].checks) {
                            pData[dStr].checks.forEach(v => { if(v) comp++; poss++; });
                        }
                    });
                    const pct = poss > 0 ? Math.round((comp / poss) * 100) : 0;
                    cards.innerHTML += `<div class="theme-box p-3 rounded text-center"><p class="text-xs text-slate-300">${p}</p><p class="text-2xl font-bold theme-title">${pct}%</p></div>`;
                    return pct;
                });
                if (chart) chart.destroy();
                chart = new Chart(document.getElementById('myChart').getContext('2d'), {
                    type: 'bar',
                    data: { labels: persons, datasets: [{ label: 'Zikr Completion %', data: pcts, backgroundColor: ['#ff007f', '#00c8ff', '#b400ff', '#ff8000'], borderRadius: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
                });
            } else {
                const key = cat === 'extra' ? 'extraData' : 'namaazData';
                const list = cat === 'extra' ? extras : namaazs;
                const data = getData(key);
                const pcts = persons.map(p => {
                    const pData = data[p] || {};
                    let comp = 0, poss = 0, now = new Date();
                    Object.keys(pData).forEach(dStr => {
                        const d = new Date(dStr);
                        let inc = false;
                        if (tf === 'daily' && dStr === today) inc = true;
                        else if (tf === 'weekly' && Math.abs(now - d) / 86400000 <= 7) inc = true;
                        else if (tf === 'monthly' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) inc = true;
                        else if (tf === 'yearly' && d.getFullYear() === now.getFullYear()) inc = true;
                        if (inc && Array.isArray(pData[dStr])) {
                            pData[dStr].forEach(v => { if(v) comp++; poss++; });
                        }
                    });
                    const pct = poss > 0 ? Math.round((comp / poss) * 100) : 0;
                    cards.innerHTML += `<div class="theme-box p-3 rounded text-center"><p class="text-xs text-slate-300">${p}</p><p class="text-2xl font-bold theme-title">${pct}%</p></div>`;
                    return pct;
                });
                if (chart) chart.destroy();
                chart = new Chart(document.getElementById('myChart').getContext('2d'), {
                    type: 'bar',
                    data: { labels: persons, datasets: [{ label: 'Completion %', data: pcts, backgroundColor: ['#ff007f', '#00c8ff', '#b400ff', '#ff8000'], borderRadius: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
                });
            }
        }
    </script>
</body>
</html>
