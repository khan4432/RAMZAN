<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Zikr & Namaaz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-grad: linear-gradient(rgba(10, 5, 25, 0.92), rgba(5, 2, 15, 0.96));
            --primary: #ff007f;
            --primary-hover: #e60073;
            --box-bg: rgba(18, 10, 35, 0.92);
            --shadow: rgba(255, 0, 127, 0.45);
        }
        body {
            background: var(--bg-grad), 
                        linear-gradient(90deg, rgba(0, 200, 255, 0.15) 0%, rgba(255, 0, 0, 0.15) 100%),
                        url('https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #ffffff;
        }
        .theme-title { color: var(--primary); text-shadow: 0 0 15px var(--shadow); }
        .theme-box { background: var(--box-bg); border: 1.5px solid var(--primary); box-shadow: 0 0 25px var(--shadow); backdrop-filter: blur(8px); }
        .theme-btn { background: var(--primary); color: #fff; font-weight: bold; box-shadow: 0 0 20px var(--shadow); transition: 0.3s; }
        .theme-btn:hover { background: var(--primary-hover); box-shadow: 0 0 30px var(--shadow); }
    </style>
</head>
<body class="min-h-screen font-sans p-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="theme-box p-4 rounded-xl flex justify-between items-center flex-wrap gap-4">
            <h1 class="text-xl font-bold theme-title">📿 Zikr & Namaaz Portal</h1>
            <div class="flex items-center gap-2 flex-wrap">
                <select id="themeSelector" onchange="changeTheme(this.value)" class="bg-slate-900 border text-xs rounded p-2 text-white outline-none max-h-60 overflow-y-auto">
                    <option value="cyberpunkneon">⚡ 1. Cyberpunk Neon Glow</option>
                    <option value="emerald">💎 2. Emerald Cyan</option>
                    <option value="gold">👑 3. Royal Gold</option>
                    <option value="sapphire">🔷 4. Sapphire Blue</option>
                    <option value="ruby">❤️ 5. Ruby Crimson</option>
                    <option value="amethyst">🔮 6. Royal Amethyst</option>
                    <option value="rosegold">✨ 7. Rose Gold</option>
                    <option value="platinum">🪙 8. Platinum Silver</option>
                    <option value="emeraldgreen">🌿 9. Imperial Emerald</option>
                    <option value="sunset">🌅 10. Sunset Copper</option>
                    <option value="cyber">⚡ 11. Cyber Neon Luxe</option>
                    <option value="neonblue">🔹 12. Electric Neon Blue</option>
                    <option value="neongreen">🟢 13. Toxic Neon Green</option>
                    <option value="neonyellow">🟡 14. Laser Neon Yellow</option>
                    <option value="neonpurple">🟣 15. Ultraviolet Neon</option>
                    <option value="neonorange">🟠 16. Blazing Neon Orange</option>
                    <option value="midnight">🌙 17. Midnight Dark</option>
                    <option value="galaxy">🌌 18. Deep Galaxy Purple</option>
                    <option value="crimson">🩸 19. Dark Crimson Night</option>
                    <option value="ocean">🌊 20. Deep Ocean Teal</option>
                    <option value="forest">🌲 21. Dark Forest Pine</option>
                    <option value="coffee">☕ 22. Espresso Coffee</option>
                    <option value="lavender">🪻 23. Soft Lavender Dark</option>
                    <option value="peach">🍑 24. Sunset Peach</option>
                    <option value="monochrome">♟️ 25. Sleek Monochrome</option>
                </select>
                <button onclick="switchTab('tracker')" id="btn-tracker" class="px-3 py-2 rounded font-medium theme-btn text-xs">Daily Zikr</button>
                <button onclick="switchTab('extrasawaab')" id="btn-extrasawaab" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">Extra Sawaab</button>
                <button onclick="switchTab('namaaz')" id="btn-namaaz" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">Daily Namaaz</button>
                <button onclick="switchTab('analytics')" id="btn-analytics" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">Analytics</button>
            </div>
        </header>

        <!-- TAB 1: DAILY ZIKR -->
        <section id="tab-tracker" class="theme-box p-6 rounded-xl space-y-4">
            <h2 class="text-lg font-semibold theme-title">Mark Daily Zikr</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelect" class="bg-slate-900 border rounded p-2 text-white text-sm"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelect" class="bg-slate-900 border rounded p-2 text-white text-sm">
            </div>
            <div id="zikrList" class="space-y-3"></div>
            <button onclick="saveZikr()" class="w-full theme-btn py-2.5 rounded text-sm">Save Zikr Progress</button>
        </section>

        <!-- TAB 2: EXTRA SAWAAB -->
        <section id="tab-extrasawaab" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <h2 class="text-lg font-semibold theme-title">Mark Extra Sawaab</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelectExtra" class="bg-slate-900 border rounded p-2 text-white text-sm"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelectExtra" class="bg-slate-900 border rounded p-2 text-white text-sm">
            </div>
            <div id="extraList" class="space-y-2"></div>
            <button onclick="save('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra')" class="w-full theme-btn py-2.5 rounded text-sm">Save Extra Sawaab</button>
        </section>

        <!-- TAB 3: DAILY NAMAAZ -->
        <section id="tab-namaaz" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <h2 class="text-lg font-semibold theme-title">Mark Daily Namaaz</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelectNamaaz" class="bg-slate-900 border rounded p-2 text-white text-sm"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelectNamaaz" class="bg-slate-900 border rounded p-2 text-white text-sm">
            </div>
            <div id="namaazList" class="space-y-2"></div>
            <button onclick="save('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz')" class="w-full theme-btn py-2.5 rounded text-sm">Save Namaaz Progress</button>
        </section>

        <!-- TAB 4: ANALYTICS -->
        <section id="tab-analytics" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h2 class="text-lg font-semibold theme-title">Analytics & Reports</h2>
                <div class="flex gap-2">
                    <select id="catSelect" onchange="drawChart()" class="bg-slate-900 border rounded p-1.5 text-white text-xs">
                        <option value="zikr">Daily Zikr</option>
                        <option value="extra">Extra Sawaab</option>
                        <option value="namaaz">Daily Namaaz</option>
                    </select>
                    <select id="timeSelect" onchange="drawChart()" class="bg-slate-900 border rounded p-1.5 text-white text-xs">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="cards"></div>
            <div class="relative h-72"><canvas id="myChart"></canvas></div>
        </section>
    </div>

    <script>

            rosegold: { primary: "#fb7185", hover: "#f43f5e", box: "rgba(35, 18, 24, 0.9)", shadow: "rgba(251, 113, 133, 0.3)", bg: "linear-gradient(rgba(30, 15, 20, 0.90), rgba(15, 8, 10, 0.94))" },
            platinum: { primary: "#e2e8f0", hover: "#cbd5e1", box: "rgba(30, 41, 59, 0.9)", shadow: "rgba(226, 232, 240, 0.2)", bg: "linear-gradient(rgba(15, 23, 42, 0.90), rgba(15, 23, 42, 0.94))" },
            emeraldgreen: { primary: "#10b981", hover: "#059669", box: "rgba(10, 30, 20, 0.9)", shadow: "rgba(16, 185, 129, 0.3)", bg: "linear-gradient(rgba(5, 25, 15, 0.90), rgba(2, 15, 8, 0.94))" },
            sunset: { primary: "#f97316", hover: "#ea580c", box: "rgba(35, 18, 10, 0.9)", shadow: "rgba(249, 115, 22, 0.3)", bg: "linear-gradient(rgba(30, 15, 5, 0.90), rgba(15, 8, 2, 0.94))" },
            cyber: { primary: "#f43f5e", hover: "#e11d48", box: "rgba(20, 10, 40,
